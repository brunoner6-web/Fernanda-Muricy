<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernanda Muricy · Psicóloga CRP-03/30964</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F4EDE2"></rect><text x="50" y="62" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#B5603E">FM</text></svg></template>
<style>html,body{margin:0;padding:0}</style>
</helmet>
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><dc-import name="LP Fernanda Muricy" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCriancas }}"><dc-import name="Criancas-e-Adolescentes" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAdultos }}"><dc-import name="Adultos" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isNeuro }}"><dc-import name="Neuropsicologia" hint-size="100%,100vh"></dc-import></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  routes = { 'LP Fernanda Muricy': 'home', 'Criancas-e-Adolescentes': 'criancas', 'Adultos': 'adultos', 'Neuropsicologia': 'neuro' };
  state = { page: new URLSearchParams(location.search).get('p') || 'home' };
  componentDidMount() {
    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = decodeURIComponent(a.getAttribute('href'));
      const m = href.match(/([^\/]+)\.dc\.html(#.*)?$/);
      if (!m || !this.routes[m[1]]) return;
      e.preventDefault();
      this.go(this.routes[m[1]], m[2]);
    };
    this.onPop = () => this.setState({ page: new URLSearchParams(location.search).get('p') || 'home' });
    document.addEventListener('click', this.onClick, true);
    window.addEventListener('popstate', this.onPop);
  }
  componentWillUnmount() {
    document.removeEventListener('click', this.onClick, true);
    window.removeEventListener('popstate', this.onPop);
  }
  go(page, hash) {
    try { history.pushState(null, '', page === 'home' ? location.pathname : '?p=' + page); } catch (e) {}
    this.setState({ page }, () => setTimeout(() => {
      const el = hash && document.getElementById(hash.slice(1));
      window.scrollTo(0, el ? el.getBoundingClientRect().top + window.scrollY : 0);
    }, 60));
  }
  renderVals() {
    const p = this.state.page;
    return { isHome: p === 'home', isCriancas: p === 'criancas', isAdultos: p === 'adultos', isNeuro: p === 'neuro' };
  }
}
</script>
</body>
</html>
